name: Bug report
description: Report incorrect behavior of the proxy or dashboard.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Redact access tokens, refresh tokens, client IDs, client secrets and account details
        from everything you paste. Report security issues privately; see SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the proxy with ...
        2. Request ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Node.js 22.x, Ubuntu 24.04, systemd service, BIND_HOST=0.0.0.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or responses
      description: Service log lines or API responses, with secrets removed.
      render: text
